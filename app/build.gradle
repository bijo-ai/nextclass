plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bijo.bijotouch'
    compileSdk 36

    defaultConfig {
        applicationId "com.bijo.nextclass"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Framework-only, no third-party libraries: fast build, nothing to version-clash.
dependencies {
}
